name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Test
        shell: pwsh
        run: ./scripts/run-tests.ps1
      - name: Prepare standalone executable
        shell: pwsh
        run: |
          Copy-Item ./build/vs2022-x64-release/Release/Gifler.exe ./Gifler.exe
          $hash = (Get-FileHash ./Gifler.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Gifler.exe" | Set-Content -Encoding ascii ./Gifler.exe.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Gifler.exe
            Gifler.exe.sha256
